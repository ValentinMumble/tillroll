<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Tillroll's iPhone home screen icon: a lowercase t in San Francisco Bold, white, beside the app's three coloured
       bars, on black, full bleed (iOS rounds the corners). The t is the system's own type, so render it on a Mac:
       design/render-icons.sh draws it to public/ with headless Chrome. -->
  <rect width="1024" height="1024" fill="#000000" />
  <text
    x="165"
    y="800"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
    font-size="900"
    font-weight="700"
  >t</text>
  <g fill="none" stroke-linecap="round" stroke-width="64">
    <path d="M558 380H818" stroke="#2a78d6" />
    <path d="M558 512H728" stroke="#eb6834" />
    <path d="M558 644H778" stroke="#1baf7a" />
  </g>
</svg>
