<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Tillroll: your Revolut spending week by week and month by month, by store and by category."
    />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Added to the iPhone home screen, it opens full screen like an app (see the tab bar in src/styles/shell.css). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tillroll" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- While iOS starts the home-screen app: the app's own loading screen, not a blank one. iOS wants one image per
         screen size: this is the iPhone 16 Pro's (402 x 874 points at 3x), rendered by design/render-launch.mjs. -->
    <link
      rel="apple-touch-startup-image"
      href="/launch-light.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/launch-dark.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"
    />
    <title>Tillroll</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- An owner's page opens on its loading screen before the app's script has run, so nothing blank shows between
         the launch image and the app; React replaces it once it runs. The markup is the app's own, kept in
         src/loading-frame.html by design/render-launch.mjs and put here by vite.config.ts. -->
    <template id="loading-frame"><!-- loading frame --></template>
    <script>
      // Owner mode, as isOwnerBrowser in src/owner.ts tells it: a visitor's page opens on the first screen instead.
      try {
        if (document.cookie.split(/;\s*/).includes('tillroll_owner=1') || localStorage.getItem('tillroll.owner')) {
          document.getElementById('root').append(document.getElementById('loading-frame').content.cloneNode(true));
        }
      } catch {
        // No storage: the app's own loading screen shows once its script runs.
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
